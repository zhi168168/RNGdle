    <text x="34" y="184" fill="#f7f4ea" font-family="Consolas, monospace" font-size="82" font-weight="900">739271</text>
    <rect x="34" y="226" width="316" height="74" rx="14" fill="#f0b429"/>
    <text x="192" y="275" text-anchor="middle" fill="#12110d" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">GENERATE</text>
    <g transform="translate(34 332)">
      <rect width="94" height="78" rx="12" fill="#171715" stroke="#454137" stroke-width="2"/>
      <text x="47" y="32" text-anchor="middle" fill="#b7b0a0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">EP</text>
      <text x="47" y="62" text-anchor="middle" fill="#5dd39e" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">320</text>
      <rect x="112" width="94" height="78" rx="12" fill="#171715" stroke="#454137" stroke-width="2"/>
      <text x="159" y="32" text-anchor="middle" fill="#b7b0a0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">BADGES</text>
      <text x="159" y="62" text-anchor="middle" fill="#f7f4ea" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900">7</text>
      <rect x="224" width="92" height="78" rx="12" fill="#171715" stroke="#454137" stroke-width="2"/>
      <text x="270" y="32" text-anchor="middle" fill="#b7b0a0" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="800">RARITY</text>
      <text x="270" y="62" text-anchor="middle" fill="#7aa2f7" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="900">RARE</text>
    </g>
  </g>
  <g transform="translate(92 412)">
    <rect width="142" height="54" rx="27" fill="#21201c" stroke="#454137" stroke-width="2"/>
    <text x="71" y="36" text-anchor="middle" fill="#ffe9a3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">Prime</text>
    <rect x="158" width="190" height="54" rx="27" fill="#21201c" stroke="#454137" stroke-width="2"/>
    <text x="253" y="36" text-anchor="middle" fill="#ffe9a3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">Six Digits</text>
    <rect x="364" width="178" height="54" rx="27" fill="#21201c" stroke="#454137" stroke-width="2"/>
    <text x="453" y="36" text-anchor="middle" fill="#ffe9a3" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="900">Lucky 7</text>
