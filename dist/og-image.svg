<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RNGdle daily random number game</title>
  <desc id="desc">A branded RNGdle preview showing a daily number roll, badge count, and EP score.</desc>
  <rect width="1200" height="630" fill="#0d0d0b"/>
  <path d="M0 0h1200v630H0z" fill="#0d0d0b"/>
  <path d="M0 0h1200v250H0z" fill="#171715"/>
  <path d="M0 0h1200v630H0z" fill="none" stroke="#f2c94c" stroke-width="18"/>
  <g transform="translate(84 76)">
    <text x="0" y="44" fill="#f2c94c" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="900" letter-spacing="5">DAILY RANDOM NUMBER GAME</text>
    <text x="0" y="180" fill="#f7f4ea" font-family="Inter, Arial, sans-serif" font-size="132" font-weight="900">RNGdle</text>
    <text x="4" y="242" fill="#b7b0a0" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700">Roll once. Collect badges. Score EP.</text>
  </g>
  <g transform="translate(704 86)">
